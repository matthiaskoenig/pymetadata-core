line-length = 88
target-version = "py311"
extend-exclude = ["spike", "target", ".venv", "dist"]

[lint]
select = ["E4", "E7", "E9", "F", "W", "I", "D", "UP", "B", "C4", "SIM", "RET", "PIE", "RUF"]
# names such as `König` are german, not ambiguous unicode
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["pymetadata_core"]

